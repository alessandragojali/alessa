<head>
    <title>image HTML dan CSS</title>

    <body>
        <!-- Cara Menambahkan Gambar-->
         <P> Ini adalah gambar ukuran normal</P>
         <img src="minion.png" alt="minion">

         <!--Cara merubahkan ukuran gambar-->
         <p>ini adalah gambar yang diberi ukuran</p>
         <img src="minion.png" alt="minion" class=""ukuran">
        
        
         <!--Cara memberikan lengkungan pada gambar-->
         <P> Ini adalah gambar yang diberi lengkungan</P>
         <img src="minion.png" alt="minion" class=""lengkungan">
        
         <!--Cara menggunakan gambar dan teks-->
          <div class="kelompok">
            <img src="minion.png" alt="minion"
            <p> Gambar minion</p>   
          </div> 
    </body>
